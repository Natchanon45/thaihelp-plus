<!doctype html>
<html lang="th">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>ไทยช่วยไทย พลัส</title>
        <meta name="theme-color" content="#06C755" />
        <meta name="description" content="คำนวณสิทธิ์ไทยช่วยไทย พลัส 60/40" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="ไทยช่วยไทย" />
        <link rel="apple-touch-icon" href="https://www.ไทยช่วยไทยพลัส.th/assets/img/tct_logo.png" />
        <!-- PWA -->
        <link rel="manifest" href="manifest.json" />
        <!-- Favicon -->
        <link rel="icon" type="image/png" href="https://www.ไทยช่วยไทยพลัส.th/assets/img/tct_logo.png" />
        <!-- Google Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
        <!-- Flaticon -->
        <link
            rel="stylesheet"
            href="https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css"
        />
        <!-- App CSS -->
        <link rel="stylesheet" href="assets/css/style.css" />
    </head>
    <body>
        <!-- Splash Screen -->
        <div id="splash-screen">
            <img src="https://www.ไทยช่วยไทยพลัส.th/assets/img/tct_logo.png" alt="logo" />
            <h1>ไทยช่วยไทย พลัส</h1>
            <p>กำลังโหลดข้อมูล...</p>
        </div>
        <!-- Main App -->
        <div id="app">
            <!-- Header -->
            <header class="app-header">
                <div class="container">
                    <div class="header-card">
                        <img src="https://www.ไทยช่วยไทยพลัส.th/assets/img/tct_logo.png" class="logo" />
                        <div>
                            <h1 class="app-title">ไทยช่วยไทย พลัส</h1>
                            <div class="app-subtitle">โครงการช่วยค่าครองชีพ 60/40</div>
                        </div>
                        <button id="toggleTheme" class="theme-btn">
                            <i class="fi fi-rr-moon"></i>
                        </button>
                    </div>
                </div>
            </header>
            <!-- PAGE : DASHBOARD -->
            <main id="page-home" class="page active-page">
                <div class="container">
                    <!-- Date -->
                    <div class="date-card">
                        <i class="fi fi-rr-calendar"></i>
                        <span id="currentDate"></span>
                    </div>
                    <!-- Balance -->
                    <div class="row g-3">
                        <div class="col-6">
                            <div class="balance-card">
                                <div class="balance-label">วันนี้เหลือ</div>
                                <div id="remainDaily" class="balance-value">200</div>
                                <div class="balance-max">/200 บาท</div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="balance-card">
                                <div class="balance-label">เดือนนี้เหลือ</div>
                                <div id="remainMonthly" class="balance-value">1000</div>
                                <div class="balance-max">/1000 บาท</div>
                            </div>
                        </div>
                    </div>
                    <!-- Progress -->
                    <div class="app-card mt-3">
                        <div class="section-title">
                            <i class="fi fi-rr-chart-histogram"></i>
                            การใช้สิทธิ์เดือนนี้
                        </div>
                        <div class="progress mt-3">
                            <div id="monthlyProgress" class="progress-bar bg-success" style="width: 0%"></div>
                        </div>
                    </div>
                    <!-- Calculator -->
                    <div class="app-card mt-3">
                        <div class="section-title">
                            <i class="fi fi-rr-calculator"></i>
                            คำนวณสิทธิ์
                        </div>
                        <div class="mt-3">
                            <label class="form-label">จำนวนเงินที่ต้องการซื้อ</label>
                            <div class="input-wrapper">
                                <input
                                    type="text"
                                    id="totalAmount"
                                    class="form-control form-control-lg pe-5"
                                    placeholder="เช่น 333"
                                    inputmode="decimal"
                                    autocomplete="off"
                                />
                                <button type="button" id="btnClearAmount" class="clear-btn">
                                    <i class="fi fi-rr-cross-small"></i>
                                </button>
                            </div>
                            <div class="quick-amount mt-2 d-flex flex-wrap gap-2">
                                <button class="btn btn-sm btn-soft-success amount-btn" data-value="10">10</button>
                                <button class="btn btn-sm btn-soft-success amount-btn" data-value="20">20</button>
                                <button class="btn btn-sm btn-soft-success amount-btn" data-value="50">50</button>
                                <button class="btn btn-sm btn-soft-success amount-btn" data-value="100">100</button>
                                <button class="btn btn-sm btn-soft-success amount-btn" data-value="200">200</button>
                            </div>
                        </div>

                        <div class="d-grid gap-2 mt-3">
                            <button id="btnCalculate" class="btn btn-success btn-lg">
                                <i class="fi fi-rr-calculator"></i>
                                คำนวณ
                            </button>

                            <button id="btnSave" disabled class="btn btn-outline-success">
                                <i class="fi fi-rr-disk"></i>
                                บันทึก
                            </button>
                        </div>
                    </div>
                    <!-- Result -->
                    <div id="resultCard" class="app-card result-card d-none">
                        <div class="result-title">ผลการคำนวณ</div>
                        <div class="result-grid">
                            <div class="result-item gov">
                                <i class="fi fi-rr-hand-holding-heart"></i>
                                <div>
                                    <label>รัฐช่วย</label>
                                    <span id="govAmount"> 0.00 </span>
                                </div>
                            </div>
                            <div class="result-item user">
                                <i class="fi fi-rr-user"></i>
                                <div>
                                    <label>คุณจ่าย</label>
                                    <span id="userAmount"> 0.00 </span>
                                </div>
                            </div>
                        </div>
                        <div id="capNote" class="cap-note"></div>
                    </div>
                </div>
            </main>
            <!-- PAGE : HISTORY -->
            <section id="page-history" class="page">
                <div class="container">
                    <div class="app-card">
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="section-title">
                                <i class="fi fi-rr-time-past"></i>
                                ประวัติการใช้งาน
                            </div>
                            <button id="clearAllBtn" class="btn btn-danger">ล้างทั้งหมด</button>
                        </div>
                        <input type="text" id="historySearch" class="form-control mt-3" placeholder="ค้นหารายการ" />
                        <div id="historyEmpty" class="empty-state">
                            <i class="fi fi-rr-inbox"></i>
                            <p>ยังไม่มีรายการ</p>
                        </div>
                        <div class="table-responsive">
                            <table class="table align-middle">
                                <thead>
                                    <tr>
                                        <th>วันที่</th>
                                        <th>ยอดซื้อ</th>
                                        <th>รัฐช่วย</th>
                                        <th>คุณจ่าย</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="historyTable"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
            <!-- PAGE : SUMMARY -->
            <section id="page-summary" class="page">
                <div class="container">
                    <div class="app-card">
                        <div class="section-title">
                            <i class="fi fi-rr-chart-histogram"></i>
                            สรุปการใช้สิทธิ์
                        </div>
                        <div class="chart-container">
                            <canvas id="barChart"></canvas>
                        </div>
                    </div>
                    <div class="app-card mt-3">
                        <div class="section-title">
                            <i class="fi fi-rr-chart-line-up"></i>
                            แนวโน้มการใช้งาน
                        </div>
                        <div class="chart-container">
                            <canvas id="lineChart"></canvas>
                        </div>
                    </div>
                </div>
            </section>
        </div>
        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-page="home">
                <i class="fi fi-rr-home"></i>
                <span>หน้าแรก</span>
            </button>
            <button class="nav-btn" data-page="history">
                <i class="fi fi-rr-time-past"></i>
                <span>ประวัติ</span>
            </button>
            <button class="nav-btn" data-page="summary">
                <i class="fi fi-rr-chart-histogram"></i>
                <span>สรุป</span>
            </button>
        </nav>
        <!-- Toast -->
        <div id="toastSuccess" class="toast-success">
            <i class="fi fi-rr-check"></i>
            <span id="toastMessage">สำเร็จ</span>
        </div>
        <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
        <!-- Bootstrap -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <!-- ChartJS -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <!-- App JS -->
        <script src="assets/js/app.js"></script>
        <script src="assets/js/charts.js"></script>
        <script src="assets/js/pwa.js"></script>
    </body>
</html>
